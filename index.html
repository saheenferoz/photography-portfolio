<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="91hWo-KLIf22Oe8DgepBPAW7Q3AsirZHLwAqaSBdHmA" />
  <title>Saheen Feroz — Travel</title>
  <meta name="description" content="Travel portfolio by Saheen Feroz." />
  <link rel="canonical" href="https://saheenferoz.github.io/travel-portfolio/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://saheenferoz.github.io/travel-portfolio/" />
  <meta property="og:title" content="Saheen Feroz — Travel" />
  <meta property="og:description" content="Travel portfolio by Saheen Feroz." />
  <meta property="og:image" content="https://saheenferoz.github.io/travel-portfolio/avatar.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css">
</head>
<body class="map-page">

  <header class="profile-header">
    <img class="avatar" id="avatar" src="" alt="Profile photo">
    <h1 class="name" id="profile-name">Saheen Feroz</h1>
    <p class="tagline" id="profile-tagline"></p>
    <nav class="site-nav" aria-label="Site">
      <a class="site-nav-link is-active" href="./" aria-current="page">Map</a>
      <a class="site-nav-link" href="gallery.html">Gallery</a>
      <a class="site-nav-link" href="logs.html">Logs</a>
    </nav>
  </header>

  <main class="map-main">
    <div class="map-wrap" id="map" aria-label="World map of photo locations"></div>
    <div class="map-tooltip" id="map-tooltip" role="status" aria-hidden="true"></div>
    <div class="map-mode" role="group" aria-label="Map contents">
      <button class="map-mode-btn is-active" id="mode-photos" type="button" aria-pressed="true">Photos</button>
      <button class="map-mode-btn" id="mode-logs" type="button" aria-pressed="false">Logs</button>
    </div>
    <div class="map-timeline" id="map-timeline" role="group" aria-label="Filter pins by year">
      <button class="timeline-play" id="timeline-play" type="button" aria-label="Play timeline">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <span class="timeline-year" id="timeline-label-start"></span>
      <div class="timeline-track-wrap">
        <div class="timeline-track" aria-hidden="true"></div>
        <div class="timeline-fill" id="timeline-fill" aria-hidden="true"></div>
        <input type="range" class="timeline-range" id="timeline-start" aria-label="Start year">
        <input type="range" class="timeline-range" id="timeline-end" aria-label="End year">
      </div>
      <span class="timeline-year" id="timeline-label-end"></span>
    </div>
    <p class="map-attribution">
      Geocoding © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
    </p>
  </main>

  <aside class="log-panel" id="log-panel" aria-labelledby="log-panel-title">
    <button class="log-panel-close" id="log-panel-close" aria-label="Close log">&times;</button>
    <h2 class="log-panel-title" id="log-panel-title"></h2>
    <p class="log-panel-subtitle" id="log-panel-subtitle"></p>
    <div class="log-panel-body" id="log-panel-body"></div>
  </aside>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&#8249;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">&#8250;</button>
    <div class="lightbox-content">
      <img class="lightbox-img" id="lightbox-img" src="" alt="">
      <div class="lightbox-details">
        <p class="lightbox-caption is-empty" id="lightbox-caption"></p>
        <div class="lightbox-meta">
          <a class="lightbox-location" id="lightbox-location" href="#" target="_blank" rel="noopener" title="Open in Google Maps">
            <svg class="pin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="lightbox-location-text"></span>
          </a>
          <span class="lightbox-date" id="lightbox-date"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/d3.v7.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="logs-card.js"></script>
  <script src="map.js"></script>
</body>
</html>
