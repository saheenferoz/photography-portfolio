# Travel log for one country. Parsed by scripts/build_logs.py into logs.json.
#
# Strict hierarchy: country -> regions[] -> areas[] -> places[]. A region has
# 'areas' and/or 'notes'; nothing sits directly on a region except those.
#
# An area is either:
#   - a group: `area: <name>`, `places:` (a list of places, each named by its
#     type key below), and optionally `location`/`notes`.
#   - a bare leaf, for a standalone sight with nothing to group: just
#     `area: <name>` (the sight's name), optionally with `notes`/`verdict`/
#     `location` -- the same fields a place would have. A drive or food with
#     no fixed point of its own (a highway, a one-off restaurant) goes in a
#     group area named after the region itself instead, so it still resolves
#     to the whole region.
#
# A place (inside a group's `places:`) is named by exactly one of these keys,
# which also sets its type: place (sight, the default), trail, activity,
# event, food, drive, wildlife. E.g. `food: Some Cafe` instead of
# `type: food` + `name: Some Cafe`.
#
# A remark -- whether a one-off aside or something not tied to any place --
# always goes in a `notes:` list, never a bare `note:` field. There's exactly
# one place it can live: on a place/leaf area/dish (about that thing), or on
# a region/group area (not tied to anything inside it, e.g. a passing
# observation). The latter never gets a map pin or a location.
#
# Optional on a place (or a leaf area): notes (a list of remarks), verdict
#   (repeat|fine|skip), dishes (food only, `dish:`/notes/verdict each),
#   location.
#
# `location` overrides the geocoded key, on a group area (all its places) or
# a single place (wins over the area's). Leave it off unless the default
# (the area's name, or the region for an area named after it) is wrong.
# Regions are kept alphabetical; run scripts/build_logs.py after editing.

