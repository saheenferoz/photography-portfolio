# Travel log for one country. Parsed by scripts/build_logs.py into logs.json.
#
# Required: country, regions[].name, regions[].places[].name
# Optional on a place: area, type (sight|trail|food|drive|wildlife|note; default sight),
#   note, notes, verdict (repeat|fine|skip), dishes, location
# Optional on a dish: note, verdict
#
# `location` overrides the geocoded key. Leave it off unless the default
# (area, or "Name, Region" for a bare sight) is wrong.
# `note` is a remark rather than a visited place -- it never gets a map pin
# or a location, and `location` is not allowed on one.
# Regions are kept alphabetical; run scripts/build_logs.py after editing.

